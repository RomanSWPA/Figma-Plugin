<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reels Converter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px; color: #1a1a1a; background: #fff;
      padding: 16px; user-select: none;
    }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .header-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #f84f39, #e8182d);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: 0 2px 6px rgba(232,24,45,.35);
    }
    .header h1 { font-size: 13px; font-weight: 700; line-height: 1.2; }
    .header p  { font-size: 11px; color: #777; margin-top: 2px; }

    .card { background: #f5f5f5; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
    .card-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: #999; margin-bottom: 6px; }
    .sel-row { display: flex; align-items: center; gap: 6px; min-height: 20px; }
    .sel-name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sel-dim  { font-size: 10px; color: #888; background: #e4e4e4; padding: 2px 5px; border-radius: 4px; flex-shrink: 0; }
    .sel-empty { color: #aaa; font-style: italic; }

    .diagram-wrap {
      display: flex; align-items: center; justify-content: center;
      gap: 18px; padding: 12px 8px; background: #f9f9f9;
      border-radius: 8px; margin-bottom: 14px;
    }
    .diagram-col { text-align: center; }
    .diagram-label { font-size: 10px; font-weight: 600; color: #777; margin-top: 5px; }
    .box-34  { width: 36px; height: 48px; border-radius: 3px; background: linear-gradient(160deg,#7c6fcd,#b09ef5); margin: 0 auto; }
    .box-916 { position: relative; width: 27px; height: 48px; border-radius: 3px; background: linear-gradient(160deg,#1cb87a,#0ec88c); margin: 0 auto; overflow: hidden; }
    .safe-overlay { position: absolute; left: 0; right: 0; border-top: 1.5px dashed rgba(255,255,255,.85); border-bottom: 1.5px dashed rgba(255,255,255,.85); pointer-events: none; }
    .ext-band { position: absolute; left: 0; right: 0; background: rgba(0,0,0,.18); pointer-events: none; }
    .arrow { font-size: 16px; color: #bbb; }
    .legend { font-size: 10px; color: #999; line-height: 1.6; }

    .section-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: #999; margin-bottom: 7px; }

    .radio-group  { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .radio-option {
      display: flex; align-items: center; gap: 9px; padding: 7px 10px;
      border: 1.5px solid #e8e8e8; border-radius: 7px; cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .radio-option:hover  { border-color: #c0c0c0; background: #fafafa; }
    .radio-option.active { border-color: #18a0fb; background: #e8f4ff; }
    .radio-option input  { accent-color: #18a0fb; width: 13px; height: 13px; flex-shrink: 0; cursor: pointer; }
    .radio-title { font-weight: 500; font-size: 12px; }
    .radio-desc  { font-size: 10px; color: #999; margin-top: 1px; }

    .divider { height: 1px; background: #f0f0f0; margin: 12px 0; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .toggle-row label { font-size: 12px; color: #333; cursor: pointer; }
    .switch { position: relative; display: inline-block; width: 32px; height: 18px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #ccc; border-radius: 18px; cursor: pointer; transition: background .2s; }
    .slider::before { content: ''; position: absolute; width: 12px; height: 12px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: transform .2s; }
    .switch input:checked + .slider          { background: #18a0fb; }
    .switch input:checked + .slider::before { transform: translateX(14px); }

    #convertBtn {
      width: 100%; padding: 10px; background: #18a0fb; color: #fff;
      border: none; border-radius: 7px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background .15s; margin-bottom: 8px;
    }
    #convertBtn:hover:not(:disabled)  { background: #0d8de8; }
    #convertBtn:active:not(:disabled) { background: #0a7acf; }
    #convertBtn:disabled { background: #bbb; cursor: not-allowed; }

    #multiHint { font-size: 10px; color: #888; text-align: center; margin-bottom: 6px; display: none; }

    .status { display: none; padding: 8px 10px; border-radius: 6px; font-size: 11px; line-height: 1.5; }
    .status.ok  { display: block; background: #d1f5e0; color: #0e5c31; }
    .status.err { display: block; background: #fde0e3; color: #821720; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M5 3.5L13 8L5 12.5V3.5Z" fill="white"/>
      </svg>
    </div>
    <div>
      <h1>Reels Converter</h1>
      <p>3:4 banner &rarr; 9:16 Instagram Reels</p>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Selected Frame</div>
    <div class="sel-row" id="selDisplay">
      <span class="sel-empty">No frame selected &mdash; pick one or more frames</span>
    </div>
  </div>

  <div class="diagram-wrap">
    <div class="diagram-col">
      <div class="box-34"></div>
      <div class="diagram-label">3:4</div>
    </div>
    <div class="arrow">&rarr;</div>
    <div class="diagram-col">
      <div class="box-916">
        <div class="ext-band"     id="extTop"      style="top:0; height:12.5%;"></div>
        <div class="safe-overlay" id="safeOverlay" style="top:12.5%; height:75%;"></div>
        <div class="ext-band"     id="extBot"      style="bottom:0; height:12.5%;"></div>
      </div>
      <div class="diagram-label">9:16</div>
    </div>
    <div class="legend">
      <div><span style="color:#1cb87a">&#9642;</span> bg fills</div>
      <div><span style="color:rgba(255,255,255,.85)">--</span> safe zone</div>
    </div>
  </div>

  <div class="section-label">Extra Space Distribution</div>
  <div class="radio-group" id="radioGroup">
    <label class="radio-option active" data-value="even">
      <input type="radio" name="dist" value="even" checked>
      <div><div class="radio-title">Centered &mdash; even split</div>
           <div class="radio-desc">Equal space top &amp; bottom (recommended)</div></div>
    </label>
    <label class="radio-option" data-value="top">
      <input type="radio" name="dist" value="top">
      <div><div class="radio-title">Extend top only</div>
           <div class="radio-desc">Original content anchored to the bottom</div></div>
    </label>
    <label class="radio-option" data-value="bottom">
      <input type="radio" name="dist" value="bottom">
      <div><div class="radio-title">Extend bottom only</div>
           <div class="radio-desc">Original content anchored to the top</div></div>
    </label>
  </div>

  <div class="divider"></div>

  <div class="toggle-row">
    <label for="safeZoneToggle">Show safe-zone guide on output</label>
    <label class="switch">
      <input type="checkbox" id="safeZoneToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <button id="convertBtn" disabled>Convert to 9:16 Reels</button>
  <div id="multiHint"></div>
  <div class="status" id="statusMsg"></div>

<script>
  parent.postMessage({ pluginMessage: { type: 'get-selection' } }, '*');

  document.getElementById('radioGroup').addEventListener('change', function(e) {
    document.querySelectorAll('.radio-option').forEach(function(o) {
      o.classList.toggle('active', o.dataset.value === e.target.value);
    });
    updateDiagram(e.target.value);
  });

  function updateDiagram(dist) {
    var extra = 0.25;
    var tf = dist === 'top' ? extra : dist === 'bottom' ? 0 : extra / 2;
    var bf = extra - tf;
    document.getElementById('extTop').style.height      = (tf * 100) + '%';
    document.getElementById('extBot').style.height      = (bf * 100) + '%';
    document.getElementById('safeOverlay').style.top    = (tf * 100) + '%';
    document.getElementById('safeOverlay').style.height = '75%';
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderSelection(data) {
    var display = document.getElementById('selDisplay');
    var btn     = document.getElementById('convertBtn');
    var hint    = document.getElementById('multiHint');

    if (!data || data.count === 0) {
      var note = (data && data.selectedType) ? ' (' + data.selectedType + ' selected &mdash; pick the outer Frame)' : '';
      display.innerHTML   = '<span class="sel-empty">No frame selected' + note + '</span>';
      hint.style.display  = 'none';
      btn.disabled        = true;
      btn.textContent     = 'Convert to 9:16 Reels';
      return;
    }

    if (data.count > 1) {
      display.innerHTML  = '<span class="sel-name">' + data.count + ' frames selected</span>';
      hint.textContent   = 'All ' + data.count + ' frames will be converted';
      hint.style.display = 'block';
      btn.disabled       = false;
      btn.textContent    = 'Convert ' + data.count + ' Frames to 9:16';
      return;
    }

    // Single frame — show name + dimensions, enable button unconditionally
    hint.style.display = 'none';
    display.innerHTML =
      '<span class="sel-name" title="' + esc(data.name) + '">' + esc(data.name) + '</span>' +
      '<span class="sel-dim">' + data.width + '&times;' + data.height + '</span>';
    btn.disabled    = false;
    btn.textContent = 'Convert to 9:16 Reels';
  }

  document.getElementById('convertBtn').addEventListener('click', function() {
    var dist      = document.querySelector('input[name="dist"]:checked').value;
    var showGuide = document.getElementById('safeZoneToggle').checked;
    var btn       = document.getElementById('convertBtn');
    var statusEl  = document.getElementById('statusMsg');
    statusEl.className = 'status';
    btn.disabled    = true;
    btn.textContent = 'Converting…';
    parent.postMessage({
      pluginMessage: { type: 'convert', options: { distribution: dist, showSafeZone: showGuide } }
    }, '*');
  });

  window.addEventListener('message', function(e) {
    var msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'selection-info') {
      renderSelection(msg);
    } else if (msg.type === 'result') {
      parent.postMessage({ pluginMessage: { type: 'get-selection' } }, '*');
      var el = document.getElementById('statusMsg');
      el.className   = 'status ' + (msg.success ? 'ok' : 'err');
      el.textContent = msg.message;
    }
  });

  updateDiagram('even');
</script>
</body>
</html>
